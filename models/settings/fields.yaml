tabs:
    fields:
        slug_is_translatable:
            tab: lovata.toolbox::lang.tab.settings
            span: left
            label: lovata.toolbox::lang.settings.slug_is_translatable
            type: checkbox
        queue_on:
            tab: lovata.toolbox::lang.tab.mail
            span: left
            label: lovata.toolbox::lang.field.queue_on
            type: checkbox
        queue_name:
            tab: lovata.toolbox::lang.tab.mail
            span: left
            label: lovata.toolbox::lang.field.queue_name
            type: text
        decimals:
            tab: lovata.toolbox::lang.tab.prices_format
            span: left
            label: lovata.toolbox::lang.field.decimals
        dec_point:
            tab: lovata.toolbox::lang.tab.prices_format
            span: left
            label: lovata.toolbox::lang.field.dec_point
            type: dropdown
            options:
                dot: lovata.toolbox::lang.field.dot
                comma: lovata.toolbox::lang.field.comma
        thousands_sep:
            tab: lovata.toolbox::lang.tab.prices_format
            span: left
            label: lovata.toolbox::lang.field.thousands_sep
            type: dropdown
            options:
                together: lovata.toolbox::lang.field.together
                space: lovata.toolbox::lang.field.space
        import_queue_on:
            tab: lovata.toolbox::lang.tab.import
            span: left
            label: lovata.toolbox::lang.field.import_queue_on
            type: checkbox
        import_queue_name:
            tab: lovata.toolbox::lang.tab.import
            span: left
            label: lovata.toolbox::lang.field.import_queue_name
            type: text
        image_sets_enabled:
            tab: lovata.toolbox::lang.tab.images
            span: left
            label: lovata.toolbox::lang.field.image_sets_enabled
            type: switch
            default: 0
        image_profiles_approach:
            tab: lovata.toolbox::lang.tab.images
            span: left
            label: lovata.toolbox::lang.field.image_profiles_approach
            comment: lovata.toolbox::lang.field.image_profiles_approach_comment
            type: balloon-selector
            default: desktop_first
            options:
                mobile_first: lovata.toolbox::lang.field.mobile_first
                desktop_first: lovata.toolbox::lang.field.desktop_first
