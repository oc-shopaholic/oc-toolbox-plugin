form: $/lovata/toolbox/models/imageprofile/fields.yaml
defaultRedirect: lovata/toolbox/imageprofiles
create:
    title: 'backend::lang.form.create_title'
    redirect: 'lovata/toolbox/imageprofiles/update/:id'
